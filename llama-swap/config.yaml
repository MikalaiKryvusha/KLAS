# llama-swap — менеджер «спит, пока не позовут» для LLM-серверов KLAS (Фаза 4).
# Слушает 127.0.0.1:8080 (тот же порт, что раньше держал llama-server напрямую, — Zoo Code и
# другие OpenAI-клиенты работают без изменений). По полю `model` запроса llama-swap сам
# запускает нужный llama-server (порт ${PORT} назначает автоматически) и выгружает его после
# простоя ttl секунд — VRAM свободна, пока ИИ не позвали.
#
# Запуск:   llama-swap -config F:\KLAS\llama-swap\config.yaml -listen 127.0.0.1:8080
# Проверка: powershell -File F:\KLAS\tools\health-check.ps1 | веб-UI: http://127.0.0.1:8080/ui/
#
# ────────────────────────────────────────────────────────────────────────────────────────────
# 🧹 ЗООПАРК РАСПУЩЕН 2026-08-16 (слово владельца: «нет смысла держать зоопарк глупых моделей»).
# Осталось ДВА профиля вместо восьми: одна умная и одна быстрая. Освобождено 71.7 ГиБ на диске.
# Удалены: Qwythos-9B · Ornith-1.0-35B · Qwen3.5-35B-A3B · Qwen3.6-27B (обе, MTP и обычная) ·
# qwen2.5-coder-14b · gemma-4-12b. Любую можно вернуть одной командой:
#   node tools/try-model.mjs <hf-repo> <файл.gguf>          (репозитории — в tools/deploy.manifest.json)
# Оплаченные ими уроки НЕ потеряны — вынесены в журнал: EXP-0064 (штрафы за повтор ломают
# тул-коллы: gemma 4.60 → 6.00/6.0 после их снятия) и EXP-0065 (VRAM едят ВЕСА, а не KV: урезание
# контекста 98304 → 32768 освободило всего 330 МБ). Отсеянные ранее кандидаты — gpt-oss-20b (ум
# 5.7/8 ниже критерия владельца, интервью 006 Q3).
#
# ⚠️ ПОБОЧНЫЙ ЭФФЕКТ, который стоит знать: gemma-4-12b была ЕДИНСТВЕННОЙ моделью, рядом с которой
# в 16 ГиБ помещался движок клона голоса (3.15 ГБ). Оба оставшихся профиля занимают ~12.5–12.7 ГиБ,
# поэтому слот «LLM + голос одновременно» сейчас пуст. Когда дойдём до plans/18 — вернуть лёгкую
# модель одной командой выше.
# ────────────────────────────────────────────────────────────────────────────────────────────
#
# KV-кеш квантуется в q8_0 (безопасно для агентики, researches/02) — это ~2x к вместимости контекста.
# thinking отключён везде (--chat-template-kwargs): агентским клиентам нужен чистый ответ, а не
# «размышления» в поле reasoning_content (иначе при малом max_tokens ответ приходит пустым).

models:
  # ⭐⭐ ОСНОВНАЯ МОДЕЛЬ KLAS (решение владельца 2026-08-16) — Qwen3.8-27B, плотная 27B поколения 3.8.
  # Заявка вендора против нашей прежней 3.6-27B: SWE-bench Pro 61.7 против 53.5, OSWorld
  # (управление компьютером) 84.3 против 63.9. Родная vision-language, нативный контекст 262K.
  #
  # Бюджет VRAM (полная арифметика и таблица влезаемости — researches/27):
  #   веса UD-Q3_K_XL = 12.52 ГиБ (13 441 059 904 байта, измерено по HF API)
  #   KV ≈ 34 КиБ/токен — гибридная архитектура, кеш растёт лишь по 16 слоям полного внимания из 64
  #        (16 × 4 KV-головы × 256 dim × 2) — поэтому 27B вообще имеет шанс в 16 ГиБ
  #   -c 49152 → KV ≈ 1.59 ГиБ, итого ≈ 14.1 ГиБ + буферы — под потолком машины 14.99 ГиБ
  #   ⛔ Весь 4-битный ярус отвергнут БЕЗ попытки загрузки: IQ4_XS весит 14.63 ГиБ, то есть выше
  #      потолка ещё до первого токена контекста. Граница влезаемости прошла по ВЕСАМ (EXP-0065).
  #
  # Сэмплинг по рекомендации Qwen (0.6/0.95/20), БЕЗ штрафов за повтор — EXP-0064.
  # [NOT-TESTED] профиль не загружался: 1) билд b10167 от 28.07.2026 старше модели (~13.08.2026),
  # совместимость — гипотеза; 2) ручка гашения thinking у 3.8 может быть `reasoning_effort`, а не
  # `enable_thinking` — проверить по chat-шаблону при первом запуске.
  "qwen3.8-27b":
    cmd: >
      F:\KLAS\llamacpp\llama-server.exe
      -m F:\KLAS\LLMs\LLAMACPP_MODELS\Qwen3.8-27B-UD-Q3_K_XL.gguf
      --port ${PORT} -c 49152 -ctk q8_0 -ctv q8_0
      -ngl 99 --flash-attn on -b 2048 -ub 1024 --jinja
      -np 1 --slots --cont-batching
      --temperature 0.6 --top-p 0.95 --top-k 20 --min-p 0
      --chat-template-kwargs "{\"enable_thinking\": false}"
    aliases:
      - "qwen3.8-27b-r"
    ttl: 300

  # ⚡ БЫСТРАЯ модель для тривиальных задач (слово владельца 2026-08-16). Бывшая основная
  # (интервью 006, 2026-07-17). MoE A3B — при том же размере файла считает втрое-вчетверо быстрее
  # плотной 27B, потому что на токен активны лишь 3B.
  # Замеры 2026-07-17: pp 3997 / tg 164 t/s, 12.73 ГиБ, agent-bench 6/6, цепочки в ядре OpenClaw
  # чище всех (6/6 + format-hold 5/5 без флейков).
  #
  # 🚨 НО ПО ВТОРОМУ КРИТЕРИЮ ВЛАДЕЛЬЦА (2026-08-16, «от подачи запроса до первого токена») этот
  # выбор НЕ подтвердился, и это ЗАМЕР, а не мнение: холодный TTFT = **80.4 / 78.1 с** при тёплом
  # 0.08 с (`node tools/cold-ttft.mjs qwen3.6-35b-a3b`). Время загрузки определяет РАЗМЕР ФАЙЛА, а
  # не архитектура: 12.74 ГиБ MoE заливаются в VRAM ровно столько же, сколько 12.52 ГиБ плотной
  # Qwen3.8-27B ⇒ по холодному старту обе модели одинаковы, и «быстрой» среди них нет.
  # Рычаги (Direct I/O, NVMe вместо SATA, прогрев, резидентность) и план опытов — researches/28.
  # ⛔ Опыты отложены: владелец занял видеокарту 2026-08-16.
  # Алиас -r = второе имя ТОГО ЖЕ инстанса: ретрай той же модели при 500 (EXP-0003).
  "qwen3.6-35b-a3b":
    cmd: >
      F:\KLAS\llamacpp\llama-server.exe
      -m F:\KLAS\LLMs\LLAMACPP_MODELS\Qwen3.6-35B-A3B-UD-IQ3_S.gguf
      --port ${PORT} -c 98304 -ctk q8_0 -ctv q8_0
      -ngl 99 --flash-attn on -b 2048 -ub 1024 --jinja
      -np 1 --slots --cont-batching
      --temperature 0.7 --top-p 0.8 --top-k 20 --min-p 0
      --chat-template-kwargs "{\"enable_thinking\": false}"
    aliases:
      - "qwen3.6-35b-a3b-r"
    ttl: 300
