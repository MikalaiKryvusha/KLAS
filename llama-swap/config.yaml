# llama-swap — менеджер «спит, пока не позовут» для LLM-серверов KLAS (Фаза 4).
# Слушает 127.0.0.1:8080 (тот же порт, что раньше держал llama-server напрямую, — Zoo Code и
# другие OpenAI-клиенты работают без изменений). По полю `model` запроса llama-swap сам
# запускает нужный llama-server (порт ${PORT} назначает автоматически) и выгружает его после
# простоя ttl секунд — VRAM свободна, пока ИИ не позвали.
#
# Запуск:   llama-swap -config F:\KLAS\llama-swap\config.yaml -listen 127.0.0.1:8080
# Проверка: powershell -File F:\KLAS\tools\health-check.ps1 | веб-UI: http://127.0.0.1:8080/ui/
#
# ────────────────────────────────────────────────────────────────────────────────────────────
# 🧹 ЗООПАРК РАСПУЩЕН ПОЛНОСТЬЮ 2026-08-16. Слово владельца: «нет смысла держать зоопарк глупых
# моделей», затем «оставляем только самую умную 3.8 — а контур поддержки её в горячем состоянии
# решает боль ожидания долгих загрузок». Было восемь моделей и 84.4 ГиБ, стала ОДНА и 12.52 ГиБ.
#
# Удалены: Qwythos-9B · Ornith-1.0-35B · Qwen3.5-35B-A3B · Qwen3.6-27B (обе, MTP и обычная) ·
# qwen2.5-coder-14b · gemma-4-12b · Qwen3.6-35B-A3B. Вернуть любую — одна команда:
#   node tools/try-model.mjs <hf-repo> <файл.gguf> [--no-bench]     (репозитории — tools/deploy.manifest.json)
#
# Оплаченные ими уроки НЕ потеряны — вынесены в журнал: EXP-0064 (штрафы за повтор ломают
# тул-коллы: gemma 4.60 → 6.00/6.0 после их снятия) и EXP-0065 (VRAM едят ВЕСА, а не KV: урезание
# контекста 98304 → 32768 освободило всего 330 МБ). Отсеянные ранее кандидаты — gpt-oss-20b
# (ум 5.7/8 ниже критерия владельца, интервью 006 Q3).
#
# ⚠️ ЧТО МЫ ЭТИМ ПОТЕРЯЛИ, и это осознанная цена:
#   · быстрой модели для тривиальных задач больше НЕТ — лечится контуром «горячей модели» (эпик);
#   · слот «LLM + голос одновременно» пуст: gemma-4-12b была единственной, рядом с которой в 16 ГиБ
#     помещался движок клона голоса (3.15 ГБ). Упрёмся в это на plans/18.
# ────────────────────────────────────────────────────────────────────────────────────────────

models:
  # ⭐ ЕДИНСТВЕННАЯ И ОСНОВНАЯ МОДЕЛЬ KLAS (решение владельца 2026-08-16) — Qwen3.8-27B, плотная 27B.
  # Заявка вендора против прежней 3.6-27B: SWE-bench Pro 61.7 против 53.5, OSWorld (управление
  # компьютером) 84.3 против 63.9. Родная vision-language, нативный контекст 262K.
  #
  # Бюджет VRAM (полная арифметика и таблица влезаемости — researches/27):
  #   веса UD-Q3_K_XL = 12.52 ГиБ (13 441 059 904 байта, измерено)
  #   KV ≈ 34 КиБ/токен — гибридная архитектура: кеш растёт лишь по 16 слоям полного внимания из 64
  #        (16 × 4 KV-головы × 256 dim × 2) — поэтому плотная 27B вообще влезает в 16 ГиБ
  #   -c 49152 → KV ≈ 1.59 ГиБ
  #   ⛔ Весь 4-битный ярус отвергнут БЕЗ попытки загрузки: IQ4_XS весит 14.63 ГиБ — выше потолка
  #      машины ещё до первого токена контекста. Граница влезаемости прошла по ВЕСАМ (EXP-0065).
  #
  # [TESTED: 2026-08-16 · загружена и опрошена через llama-swap]
  #   · грузится на нашем билде b10167 (он старше модели — совместимость была гипотезой, снята);
  #   · холодный старт → первый токен: **34.2 с** (файл был в файловом кеше Windows после закачки);
  #   · тёплый ответ 120 токенов: **1.92 с**; по-русски отвечает связно;
  #   · ⚠️ ЗАНЯТО 15 606 МиБ из 16 303, СВОБОДНО 390 МиБ — профиль сидит на самом краю карты.
  #     Рядом не встанет ничего. Это и есть боль, ради которой строится контур «горячей модели».
  #     Захочешь запас — снижай -c: каждые 8192 токена контекста ≈ 272 МиБ KV.
  #
  # Сэмплинг по рекомендации Qwen (0.6/0.95/20), БЕЗ штрафов за повтор — EXP-0064.
  # ⚠️ [NOT-TESTED] гашение thinking: у 3.8 карточка говорит про `reasoning_effort`, а мы шлём
  # `enable_thinking` от 3.6. Ответ пришёл чистым, но специально это не проверялось.
  "qwen3.8-27b":
    cmd: >
      F:\KLAS\llamacpp\llama-server.exe
      -m F:\KLAS\LLMs\LLAMACPP_MODELS\Qwen3.8-27B-UD-Q3_K_XL.gguf
      --port ${PORT} -c 49152 -ctk q8_0 -ctv q8_0
      -ngl 99 --flash-attn on -b 2048 -ub 1024 --jinja
      -np 1 --slots --cont-batching
      --temperature 0.6 --top-p 0.95 --top-k 20 --min-p 0
      --chat-template-kwargs "{\"enable_thinking\": false}"
    aliases:
      - "qwen3.8-27b-r"
    # ttl: 300 — пока прежний. Им управляет контур «горячей модели» (эпик 2026-08-16): держать
    # модель загруженной, пока карта свободна, и отпускать её, как только владелец занял карту.
    ttl: 300
