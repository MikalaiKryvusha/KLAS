# Сервис anythingllm закомментирован при миграции в KLAS (остался в F:\LOCAL_NOMAD)
services:
  # Ваш существующий блок Kiwix
  kiwix:
    image: ghcr.io/kiwix/kiwix-serve
    container_name: kiwix_wikipedia
    volumes:
      - "F:/KLAS/KiwixDB/:/data"
    ports:
      # host-порт 8081: порт 8080 хоста закреплён за llama-server (баг 01 — конфликт портов).
      # Внутри docker-сети kiwix остаётся на 8080 — Caddy проксирует на kiwix_wikipedia:8080.
      - "8081:8080"
    command: "--urlRoot /wiki/ *.zim"
    restart: unless-stopped

  # Ваш существующий блок AnythingLLM
#   anythingllm:
#     image: mintplexlabs/anythingllm
#     container_name: anythingllm
#     ports:
#       - "3001:3001"
#     cap_add:
#       - SYS_ADMIN
#     volumes:
#       - "F:/KLAS/AnythingLLM/storage:/app/server/storage"
#       - "F:/KLAS/AnythingLLM/data:/app/server/data"
#     restart: unless-stopped
#     environment:
#       - STORAGE_DIR=/app/server/storage

  # Open WebUI — гостевой ChatGPT-подобный чат для родных (идея 09): личные аккаунты + авторизация
  # (приватные чаты у каждого), подключён к нашему LLM через OpenAI-API llama-swap на хосте.
  # llama-swap на host:8080 (прямой доступ, без auth — авторизацию пользователей держит сам Open WebUI).
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3080:8080"
    volumes:
      - "F:/KLAS/open-webui/data:/app/backend/data"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OPENAI_API_BASE_URL=http://host.docker.internal:8080/v1
      - OPENAI_API_KEY=klas-local            # llama-swap на :8080 без auth — ключ формальный
      - ENABLE_OLLAMA_API=false              # используем только OpenAI-совместимый бэкенд (llama-swap)
      - WEBUI_AUTH=true                      # личные аккаунты + логин (родные не видят чужие чаты)
      - WEBUI_NAME=KLAS Chat
      # ── Turnkey «ПОД КЛЮЧ» для родных (баг 04) ────────────────────────────────────────────────
      # Open WebUI разворачивается СРАЗУ готовым к работе: близкий регистрируется и мгновенно чатится
      # со всеми моделями — БЕЗ ручного создания групп и раздачи прав. Настройки Open WebUI по природе
      # PersistentConfig: env читается лишь при ПЕРВОМ старте, дальше значение живёт в БД и env
      # игнорируется (из-за этого правки compose на уже инициализированной БД владельца не действовали).
      - ENABLE_PERSISTENT_CONFIG=false       # env — ЕДИНСТВЕННЫЙ источник правды на КАЖДОМ старте
                                             # (конфиг как код, воспроизводимо; лечит «БД перекрывает env»).
                                             # Данные (юзеры, модели, чаты, инструменты) в БД НЕ трогаются —
                                             # это не конфиг; сбрасываются к этим значениям только тумблеры.
      - ENABLE_SIGNUP=true                   # родные могут сами зарегистрироваться (был выключен → брат не смог)
      - ENABLE_LOGIN_FORM=true               # показывать форму логина/регистрации
      - DEFAULT_USER_ROLE=user               # новый юзер СРАЗУ активен (роль 'user', не 'pending' → без
                                             # ручного одобрения админом; 'pending' и был причиной «провала»)
      - BYPASS_MODEL_ACCESS_CONTROL=true     # ВСЕ видят и используют ВСЕ модели без групп/прав — это и есть
                                             # «гостевая система под ключ» (ключ к «в новом чате видно все модели»)
      # Доступ к рабочему пространству — родные видят модели/знания/промпты/инструменты («почти как админ»).
      # Права на сами чаты и фичи (загрузка файлов, экспорт, code interpreter, web search, notes и т.д.)
      # в Open WebUI по умолчанию УЖЕ True для роли user — их не дублируем (KISS).
      - USER_PERMISSIONS_WORKSPACE_MODELS_ACCESS=true
      - USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ACCESS=true
      - USER_PERMISSIONS_WORKSPACE_PROMPTS_ACCESS=true
      - USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS=true
    restart: unless-stopped

  # НОВЫЙ блок Homepage (исправленный)
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - "3005:3000"
    volumes:
      - "F:/KLAS/homepage/config:/app/config"
      # docker.sock УБРАН (ревизия 2026-07-31): docker-провайдер homepage выключен
      # (homepage/config/docker.yaml пуст), а маунт давал контейнеру, торчащему в интернет через
      # funnel, root-эквивалентный доступ к Docker-хосту БЕЗ какой-либо пользы. Понадобятся
      # docker-виджеты — вернуть строку И включить провайдер осознанно, одним коммитом.
      # (применится при следующем `docker compose up -d`)
      # favicon пульта — векторный Кот Криник (подмена дефолтных иконок homepage)
      - "F:/KLAS/logo/favicon-32x32.png:/app/public/favicon-32x32.png"
      - "F:/KLAS/logo/favicon-16x16.png:/app/public/favicon-16x16.png"
      - "F:/KLAS/logo/apple-touch-icon.png:/app/public/apple-touch-icon.png"
      - "F:/KLAS/logo/homepage.ico:/app/public/homepage.ico"
      # PWA-иконки (Chrome «Установить приложение» берёт их из site.webmanifest)
      - "F:/KLAS/logo/android-chrome-192x192.png:/app/public/android-chrome-192x192.png"
      - "F:/KLAS/logo/android-chrome-512x512.png:/app/public/android-chrome-512x512.png"
    environment:
      # base НЕ задаём — пульт смонтирован на КОРНЕ за Caddy/funnel (баг 02); homepage корневой.
      # HOMEPAGE_ALLOWED_HOSTS — ЕДИНСТВЕННЫЙ реальный механизм host-валидации homepage (Next.js
      # Server Actions): начальный GET страницы всегда 200, но POST-ы виджетов/пингов падают с
      # "Host validation failed", если Host не в списке. Порт по умолчанию (80/443) в Host НЕ
      # входит → нужны голые `localhost`/`127.0.0.1` для входа через Caddy :80 (баг 03); варианты
      # с `:3005` — для прямого захода на homepage (dev); голое имя funnel — для входа через :443.
      - HOMEPAGE_ALLOWED_HOSTS=localhost,127.0.0.1,localhost:3005,127.0.0.1:3005,krinikspc.forest-ratio.ts.net
    restart: unless-stopped

  # ── МЕНЕДЖЕР ВИДЕОКАРТЫ — механизм эпика 26 «горячая модель» ────────────────────────────────
  # Требование владельца 2026-08-16 (ideas/21, дословно): «нужно чтобы механизм, который ты хотел
  # сделать, жил внутри KLAS контейнера в докере, и чтобы не запускал окон терминала».
  #
  # Родилось из bugs/28: тот же механизм задачей планировщика Windows каждые пять минут оставлял
  # ПУСТОЕ окно терминала (powershell — консольная программа, Windows 11 выдаёт ей консоль через
  # Windows Terminal, программа выходит, окно остаётся). Контейнер лечит корень, а не симптом:
  # консоли у него нет вовсе, поэтому окно не может появиться в принципе.
  #
  # СЕГОДНЯ РЕЖИМ `observe`: смотрит и пишет журнал, не делая НИЧЕГО (фаза 1 плана 28). Право
  # грузить и выгружать модель он получит в фазах 2-4, когда офлайн-прогон правил выберет пороги, —
  # тем же контейнером, сменой режима, а не новым сервисом.
  #
  # Карту видит через NVIDIA Container Toolkit — проверено наблюдением 2026-08-16: контейнер дал те
  # же 2704/16303 МиБ, что хост писал в журнал в ту же минуту, а `nvidia-smi` впрыскивается в любой
  # образ при NVIDIA_DRIVER_CAPABILITIES=utility, поэтому своего Dockerfile здесь нет — официальный
  # node плюс один наш файл.
  #
  # ⚠️ ЧЕГО ЭТОТ СЕРВИС НЕ ВИДИТ, и это граница гостя и хоста, а не настройка: сеансовые величины
  # владельца (бездеятельность, окно на переднем плане, «во весь экран») и список процессов карты —
  # из контейнера недостижимы. Они не подменяются нулями: их в записи просто нет, строка помечена
  # `src:"docker"`, и реплей по этой метке отказывается судить правила, которым не хватает входа.
  # Подробности и цена решения по каждому из шести правил-кандидатов — в шапке tools/gpu-manager.mjs.
  gpu-manager:
    image: node:22-slim
    container_name: gpu-manager
    command: node /app/gpu-manager.mjs
    working_dir: /app
    gpus: all
    environment:
      # utility — та возможность, при которой Container Toolkit кладёт в образ nvidia-smi.
      - NVIDIA_DRIVER_CAPABILITIES=utility
      # Отметки времени ОБЯЗАНЫ совпадать по смещению с хостовым датчиком, иначе реплей склеит два
      # журнала со сдвигом. Etc/GMT-3 — это +03:00 (знак в именах Etc обратный) без перевода часов;
      # взято фиксированным смещением намеренно, чтобы не гадать город.
      - TZ=Etc/GMT-3
      # ⛔ ОТДЕЛЬНАЯ ПАПКА, А НЕ ОБЩАЯ С ХОСТОВЫМ ДАТЧИКОМ. Пока фаза 1 не закрыта, наблюдателей
      # ДВА (хостовой ещё нужен: только он видит «во весь экран», вход правил R5/R6). Два писателя
      # в одном файле перемешали бы строки, и реплей не смог бы отличить половины друг от друга —
      # ровно этого боится комментарий про мьютекс в tools/gpu-watch.ps1. Разрывы в журнале тоже
      # считаются по одному источнику: смешанный файл показал бы сплошное покрытие там, где каждый
      # датчик по отдельности умирал.
      - GPU_WATCH_LOGDIR=/logs/docker
      # llama-swap живёт ПРОЦЕССОМ WINDOWS на 127.0.0.1:8080 (не контейнером — см. призрака ниже),
      # поэтому изнутри до него ходят через шлюз хоста.
      - GPU_WATCH_KLAS_URL=http://host.docker.internal:8080/running
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "F:/KLAS/tools:/app:ro"
      - "F:/KLAS/logs/gpu-watch:/logs"
    restart: unless-stopped

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      # Только localhost: :80 — локальный вход пульта без пароля; :443 — цель Tailscale Funnel
      # (tailscaled проксирует на 127.0.0.1:443). Наружу в LAN Caddy не публикуется.
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - "F:/KLAS/caddy/Caddyfile:/etc/caddy/Caddyfile"
      - "F:/KLAS/caddy/data:/data"
      - "F:/KLAS/caddy/config:/config"

